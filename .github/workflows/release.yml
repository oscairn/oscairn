name: Release

# Builds the macOS dmg (tools/release-macos.sh) and a Linux tarball for each CPU
# (tools/release-linux.sh), docs/releasing.md. From a v* tag they are also attached to a draft
# release, which a person publishes; nothing here publishes one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Build the dmg
        run: tools/release-macos.sh

      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: test -f "build-release/Oscairn-${GITHUB_REF_NAME#v}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: oscairn-macos-arm64
          path: build-release/*.dmg
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the build's packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev

      - name: Build the tarball
        run: tools/release-linux.sh

      - name: Check the tag names this version
        if: github.ref_type == 'tag'
        run: test -f "build-release/oscairn-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: oscairn-linux-${{ matrix.arch }}
          path: build-release/*.tar.gz
          if-no-files-found: error

  draft:
    # One job makes the draft, after every build, so that they do not race to create it.
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Attach them to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=$(case "$GITHUB_REF_NAME" in (*-*) echo --prerelease;; esac)
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag --title "Oscairn ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" files/* --clobber
