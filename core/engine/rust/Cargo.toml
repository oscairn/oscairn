[package]
name = "oscairn-engine-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
