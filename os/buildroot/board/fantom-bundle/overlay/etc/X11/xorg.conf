# The FANTOM-0's screen and touch screen for the bundle's X server, which oscairn-fantom-start
# runs on :0 in place of Roland's Weston (docs/fantom-0.md, "The display").
Section "ServerFlags"
	Option "DontVTSwitch" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# Input devices come from the system's udev (start-chroot.sh binds its /run/udev). Only the touch
# screen is taken: WRITE, MENU and TEMPO (gpio-keys) are the engine's, and the app uses no key.
Section "InputClass"
	Identifier "nothing but the touch screen"
	MatchDevicePath "/dev/input/event*"
	Option "Ignore" "on"
EndSection

# The Goodix touch screen (0 to 719 across, 0 to 1279 down, the panel's own portrait axes), turned
# with the screen: Rotate right's matrix, a point at the panel's (x, y) going to (y, 1 - x) of the
# 1280 x 720 screen.
Section "InputClass"
	Identifier "touch screen"
	MatchProduct "Goodix Capacitive TouchScreen"
	MatchIsTouchscreen "on"
	Driver "libinput"
	Option "Ignore" "off"
	Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection

# DSI-1, 720 x 1280 portrait, turned to 1280 x 720 as Weston's transform=90 did
# (a quarter turn clockwise: Rotate right; Rotate left showed it upside down). No GPU: the bundle
# has no GL for glamor, and the GPU's 2D path through Roland's Weston is what stalled the audio.
Section "Device"
	Identifier "kms"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
	Option "Monitor-DSI-1" "panel"
EndSection

Section "Monitor"
	Identifier "panel"
	Option "Rotate" "right"
EndSection

Section "Screen"
	Identifier "screen"
	Device "kms"
	Monitor "panel"
	DefaultDepth 24
EndSection
