# Oscairn's UI in Rust (docs/rust-ui.md): the shell, its top bar and the screens ported from the
# JUCE app so far, one program.
[package]
name = "oscairn-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["desktop"]
# A window on a computer (winit), as the JUCE app's.
desktop = ["slint/backend-winit"]
# Straight to a device's display (DRM dumb buffers, else /dev/fb), touch and keys through libinput: no X server.
kms = ["slint/backend-linuxkms-noseat"]

[dependencies]
# Slint under the GPLv3 (it offers GPL-3.0-only, which an AGPL-3.0-or-later program may combine with).
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "unstable-fontique-011"] }
serde_json = "1"
libc = "0.2"

# macOS: the winit event loop's activation policy, for the child of the desktop app (main.rs, no Dock icon of its own).
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.18.1"

# The KMS backend with a frame cap and frame statistics (vendor/README.md).
[patch.crates-io]
i-slint-backend-linuxkms = { path = "vendor/i-slint-backend-linuxkms-1.18.1" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
